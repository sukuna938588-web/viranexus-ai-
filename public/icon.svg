  <circle cx="436" cy="256" r="14" fill="#3b82f6" filter="url(#glow)"/>
  <line x1="422" y1="256" x2="326" y2="256" stroke="#3b82f6" stroke-width="3" stroke-opacity="0.6"/>
  <!-- Diagonal nodes -->
