  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="180" stroke="#8b5cf6" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="8 8"/>
